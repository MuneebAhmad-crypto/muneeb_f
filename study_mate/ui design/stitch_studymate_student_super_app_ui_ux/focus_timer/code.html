<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyMate - Focus Timer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#d6e4f9",
                        "secondary": "#a04100",
                        "secondary-container": "#fe6b00",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-fixed": "#001356",
                        "primary-fixed-dim": "#b8c3ff",
                        "primary": "#0040e0",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#3a4859",
                        "on-background": "#191c1e",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#b8c3ff",
                        "primary-fixed": "#dde1ff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#ffdbcc",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#0f1c2c",
                        "outline-variant": "#c4c5d9",
                        "tertiary-container": "#616e80",
                        "primary-container": "#2e5bff",
                        "on-tertiary-container": "#e8f1ff",
                        "on-surface-variant": "#434656",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary-container": "#572000",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ffb693",
                        "surface-tint": "#124af0",
                        "surface-container": "#eceef0",
                        "surface": "#f7f9fb",
                        "background": "#f7f9fb",
                        "on-secondary-fixed-variant": "#7a3000",
                        "tertiary-fixed-dim": "#bac8dc",
                        "on-primary-container": "#efefff",
                        "tertiary": "#485667",
                        "surface-bright": "#f7f9fb",
                        "outline": "#747688",
                        "on-error": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "inverse-surface": "#2d3133",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#351000",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1e",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-low": "#f2f4f6",
                        "on-primary-fixed-variant": "#0035be"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter": "20px",
                        "sm": "16px",
                        "xs": "8px",
                        "md": "24px",
                        "xl": "48px",
                        "container-max": "1200px",
                        "lg": "32px",
                        "base": "4px"
                    },
                    fontFamily: {
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Minimalist timer animation pulse */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .timer-ring-active {
            animation: pulse-ring 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-4 h-16 w-full">
<div class="flex items-center gap-xs">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">StudyMate</h1>
</div>
<div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface-container-high cursor-pointer hover:opacity-80 transition-opacity">
<img alt="Student Profile Avatar" class="object-cover w-full h-full" data-alt="A professional studio portrait of a young college student with a neutral expression, well-lit against a clean, minimal white background, wearing casual academic attire. Light mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1XarSQPgCIa6RrzHqBYf_8pjczpg7KkRO82RE_-wObX4zfflp45baKOe4dt8N0E8uD5GVQEFqVs2P32Xu4G-0ZfbpWJOSDhplDBw-weT7FBTulPANRmb1NaotEIqiw07gZa2BGqrkCDUmU-_CKtVEB3fVtAvoKBEUV8XThVdvmU9hIcJvya0OF3L74kSwHlqj5zzR5ef-9kaAv6Cc-Ndf5DZMtSaF140AgyU0UNnORaZvw8Eoa_Cc8Q"/>
</div>
</div>
</header>
<!-- Main Content Canvas (Distraction Free Focus) -->
<main class="flex-grow flex flex-col items-center justify-center p-sm md:p-lg w-full max-w-container-max mx-auto relative mb-20 md:mb-0">
<!-- Course Selector / Context -->
<div class="mb-md flex flex-col items-center gap-xs">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Current Focus</span>
<button class="group flex items-center gap-xs px-4 py-2 bg-primary-fixed text-on-primary-fixed-variant rounded-full hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-[18px]">menu_book</span>
<span class="font-body-md text-body-md font-semibold">CS 301: Data Structures</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-y-0.5 transition-transform">expand_more</span>
</button>
</div>
<!-- Timer Card Container (Glassmorphism inspired subtle depth) -->
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-[32px] shadow-[0_8px_32px_rgba(0,0,0,0.04)] border border-surface-container-highest p-8 md:p-12 flex flex-col items-center relative overflow-hidden">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 bg-gradient-to-b from-primary-fixed/20 to-transparent opacity-50 pointer-events-none"></div>
<!-- Mode Selector -->
<div class="flex bg-surface-container-low rounded-full p-1 mb-xl relative z-10 w-full max-w-[320px]">
<button class="flex-1 py-2 px-4 rounded-full bg-primary text-on-primary font-body-sm text-body-sm font-semibold shadow-sm transition-all text-center">
                    Focus
                </button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-body-sm text-body-sm font-medium transition-all text-center">
                    Short Break
                </button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-body-sm text-body-sm font-medium transition-all text-center">
                    Long Break
                </button>
</div>
<!-- Timer Display -->
<div class="relative flex items-center justify-center mb-xl z-10">
<!-- Decorative concentric circles -->
<div class="absolute w-[280px] h-[280px] rounded-full border border-primary-fixed-dim/30"></div>
<div class="absolute w-[320px] h-[320px] rounded-full border border-primary-fixed-dim/10 timer-ring-active"></div>
<h2 class="font-headline-lg font-headline-lg tracking-tighter text-on-surface select-none" style="font-size: 96px; line-height: 1; font-weight: 700;">
                    25:00
                </h2>
</div>
<!-- Controls -->
<div class="flex items-center gap-md z-10">
<button class="w-14 h-14 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px]">restart_alt</span>
</button>
<button class="h-20 w-32 flex items-center justify-center gap-2 rounded-[24px] bg-secondary-container text-on-secondary-container shadow-[0_4px_20px_rgba(254,107,0,0.2)] hover:bg-secondary transition-colors hover:text-on-secondary active:scale-95 group">
<span class="material-symbols-outlined text-[32px] group-hover:scale-110 transition-transform" data-weight="fill">play_arrow</span>
</button>
<button class="w-14 h-14 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px]">skip_next</span>
</button>
</div>
</div>
<!-- Daily Stats -->
<div class="mt-lg flex flex-col items-center text-center">
<span class="font-label-md text-label-md text-outline">Today's Total Focus</span>
<div class="font-headline-md text-headline-md text-on-surface mt-1 flex items-baseline gap-1">
                2<span class="font-body-sm text-body-sm text-on-surface-variant">h</span> 15<span class="font-body-sm text-body-sm text-on-surface-variant">m</span>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md border-t border-outline-variant shadow-none flex justify-around items-center h-20 px-2 pb-safe w-full">
<!-- Inactive: Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Inactive: Academics -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">school</span>
<span class="font-label-md text-label-md">Academics</span>
</a>
<!-- Active: Study -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-weight="fill">menu_book</span>
<span class="font-label-md text-label-md">Study</span>
</a>
<!-- Inactive: Tools -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">calculate</span>
<span class="font-label-md text-label-md">Tools</span>
</a>
<!-- Inactive: Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
</body></html>
