<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Super App - Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-xs">
<button class="p-xs rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100 flex items-center justify-center text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">StudyMate</h1>
</div>
<button class="w-10 h-10 rounded-full overflow-hidden hover:bg-surface-container-high transition-colors active:scale-95 duration-100 flex items-center justify-center bg-surface-container-high text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[1200px] mx-auto px-sm md:px-md py-md flex flex-col gap-lg pb-32">
<!-- Profile Header Glassmorphism Card -->
<section class="relative overflow-hidden rounded-xl bg-surface-container-lowest shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-md flex flex-col md:flex-row items-center gap-md border border-outline-variant/30">
<div class="w-24 h-24 md:w-32 md:h-32 rounded-full overflow-hidden border-4 border-surface shadow-sm shrink-0">
<img alt="Student Profile Picture" class="w-full h-full object-cover" data-alt="A professional headshot of a university student looking confident and approachable, smiling slightly. The lighting is bright and modern, typical of a high-end educational app light-mode aesthetic. The background is a soft, blurred campus scene with vibrant, natural colors complementing a crisp white shirt." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeWr1BC4szls-8tSaOIk8VEiBdc40gjFM1xkc3xRcKSTUfZCBpNCAGCOVUFQt0z2syj0Rg3bOD7fc9Y4a7qiovHtC8UmhUigpzsJCxq49N57e2U1VEz897cau3NOYuvi7O-IAqr-xu7zoJF1x-h3KbVgEI4fmFtBxakwX7n85EJhkAiRiqpp8bAAOpEU_dvN8vJf6q8z0bCIkQjj1ngmS566dh9ZNrkPubJ67Lm6LKC9JZDx6hkiKioQ"/>
</div>
<div class="flex flex-col text-center md:text-left gap-base flex-1">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Alex Johnson</h2>
<p class="font-body-md text-body-md text-on-surface-variant">alex.johnson@university.edu</p>
<div class="flex flex-wrap justify-center md:justify-start gap-xs mt-xs">
<span class="px-xs py-base rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md">Computer Science</span>
<span class="px-xs py-base rounded-full bg-secondary-fixed text-on-secondary-fixed-variant font-label-md text-label-md">Year 3</span>
</div>
</div>
<button class="md:self-start px-sm py-xs rounded-lg bg-surface-container-low text-primary font-label-md text-label-md hover:bg-surface-container-high transition-colors border border-outline-variant/50">
                Edit Profile
            </button>
</section>
<!-- Bento Grid Sections -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Account Settings -->
<section class="flex flex-col gap-sm">
<h3 class="font-headline-md text-headline-md text-on-surface ml-xs">Account</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden border border-outline-variant/30 flex flex-col">
<button class="flex items-center gap-sm p-sm hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="edit">edit</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">Edit Profile Info</span>
<span class="font-label-md text-label-md text-on-surface-variant font-normal">Update your personal details</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-px bg-outline-variant/30 w-full mx-sm"></div>
<button class="flex items-center gap-sm p-sm hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">Change Password</span>
<span class="font-label-md text-label-md text-on-surface-variant font-normal">Ensure your account is secure</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Preferences -->
<section class="flex flex-col gap-sm">
<h3 class="font-headline-md text-headline-md text-on-surface ml-xs">Preferences</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden border border-outline-variant/30 flex flex-col">
<div class="flex items-center justify-between p-sm hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</div>
<span class="font-body-md text-body-md font-semibold text-on-surface">Dark Mode</span>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div class="h-px bg-outline-variant/30 w-full mx-sm"></div>
<button class="flex items-center gap-sm p-sm hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="notifications">notifications</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">Notifications</span>
<span class="font-label-md text-label-md text-on-surface-variant font-normal">Manage alerts and emails</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Academic Info -->
<section class="flex flex-col gap-sm">
<h3 class="font-headline-md text-headline-md text-on-surface ml-xs">Academic</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden border border-outline-variant/30 flex flex-col">
<button class="flex items-center gap-sm p-sm hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="school">school</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">University Details</span>
<span class="font-label-md text-label-md text-on-surface-variant font-normal">View enrolled courses &amp; GPA</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Other -->
<section class="flex flex-col gap-sm">
<h3 class="font-headline-md text-headline-md text-on-surface ml-xs">Other</h3>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden border border-outline-variant/30 flex flex-col">
<button class="flex items-center gap-sm p-sm hover:bg-surface-container-low transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="info">info</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">About StudyMate</span>
<span class="font-label-md text-label-md text-on-surface-variant font-normal">Version 1.2.0</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-px bg-outline-variant/30 w-full mx-sm"></div>
<button class="flex items-center gap-sm p-sm hover:bg-error-container/20 transition-colors text-left group text-error">
<div class="w-10 h-10 rounded-full bg-error-container/30 flex items-center justify-center text-error">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md font-semibold">Logout</span>
</div>
</button>
</div>
</section>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md flex justify-around items-center h-20 px-2 pb-safe shadow-none">
<!-- Home - Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<!-- Academics - Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="school">school</span>
<span class="font-label-md text-label-md">Academics</span>
</button>
<!-- Study - Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-md text-label-md">Study</span>
</button>
<!-- Tools - Inactive -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="calculate">calculate</span>
<span class="font-label-md text-label-md">Tools</span>
</button>
<!-- Profile - Active -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-3 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
</nav>
</body></html>
