name: study_mate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.1
  http: ^1.2.2
  google_fonts: ^8.2.1
  provider: ^6.1.2
  intl: ^0.20.3
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.2
  lucide_icons: ^0.257.0
  sqflite: ^2.3.3+3
  path: ^1.9.0
  uuid: ^4.6.0
  file_picker: ^8.3.7
  path_provider: ^2.1.3
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/logo.png" # Path to your image file
  min_sdk_android: 21

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
  assets:
    - asset/logo.png
