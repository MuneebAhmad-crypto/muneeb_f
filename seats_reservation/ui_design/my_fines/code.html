<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar Semantic Shell: Destination Rule - Linear/Transactional -->
<!-- Navigation Shell Suppressed as this is a specific task (viewing/paying fines) often accessed via profile/settings with a back button. -->
<header class="bg-surface-bright w-full top-0 sticky shadow-none px-margin-mobile py-sm flex items-center justify-between border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">My Fines</h1>
</div>
<!-- Trailing icon omitted per generic back-button header requirement, or could keep avatar if standard -->
</header>
<main class="flex-1 overflow-y-auto px-margin-mobile py-md pb-[5rem]">
<!-- Total Balance Card -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md mb-lg shadow-sm">
<div class="flex flex-col items-center justify-center py-sm">
<span class="font-body-sm text-body-sm text-on-surface-variant mb-xs">Total Balance Due</span>
<span class="font-display text-display text-error">$20.00</span>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-surface-tint transition-colors duration-200 mt-md">
                Pay All
            </button>
</section>
<!-- Fine History List -->
<section>
<h2 class="font-headline-md text-headline-md text-on-background mb-md">Fine History</h2>
<div class="flex flex-col gap-sm">
<!-- Unpaid Item -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-md flex items-center justify-between relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-error"></div>
<div class="flex flex-col pl-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">Oct 24, 2023</span>
<span class="font-body-md text-body-md text-on-background">No-show for Seat A12</span>
<span class="font-label-md text-label-md text-error mt-1">$10.00</span>
</div>
<button class="bg-transparent border border-primary-container text-primary-container font-label-sm text-label-sm px-4 py-2 rounded-lg hover:bg-surface-container-low transition-colors duration-200">
                        Pay Now
                    </button>
</div>
<!-- Unpaid Item -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-md flex items-center justify-between relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-error"></div>
<div class="flex flex-col pl-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">Oct 15, 2023</span>
<span class="font-body-md text-body-md text-on-background">Late Return for Room 3B</span>
<span class="font-label-md text-label-md text-error mt-1">$10.00</span>
</div>
<button class="bg-transparent border border-primary-container text-primary-container font-label-sm text-label-sm px-4 py-2 rounded-lg hover:bg-surface-container-low transition-colors duration-200">
                        Pay Now
                    </button>
</div>
<!-- Paid Item -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-md flex items-center justify-between relative overflow-hidden opacity-75">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-[#10b981]"></div>
<div class="flex flex-col pl-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">Sep 02, 2023</span>
<span class="font-body-md text-body-md text-on-background">No-show for Seat C4</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-1 line-through">$5.00</span>
</div>
<div class="bg-[#10b981]/10 text-[#059669] px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="check_circle">check_circle</span>
<span class="font-label-sm text-label-sm">Paid</span>
</div>
</div>
</div>
</section>
<!-- Secure Payment Methods (Mockup) -->
<section class="mt-xl pt-lg border-t border-outline-variant">
<h3 class="font-body-md text-body-md text-on-surface-variant mb-sm flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="lock">lock</span> Secure Payment
             </h3>
<div class="flex gap-sm">
<div class="flex-1 bg-surface-container p-sm rounded-lg border border-outline-variant flex justify-center items-center h-12 cursor-pointer hover:bg-surface-container-high transition-colors">

</div>
</div>
