<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Invoice Maker - Add Items</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Hanken+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#f8f9ff",
                    "on-tertiary-fixed": "#171c20",
                    "background": "#f8f9ff",
                    "on-secondary-fixed-variant": "#003ea8",
                    "on-surface-variant": "#44464f",
                    "inverse-primary": "#b2c5ff",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#495d91",
                    "outline": "#757780",
                    "tertiary": "#030609",
                    "on-tertiary-fixed-variant": "#43474c",
                    "surface": "#f8f9ff",
                    "primary-container": "#001b4d",
                    "surface-container-low": "#eff4ff",
                    "primary-fixed": "#dae2ff",
                    "primary": "#000417",
                    "on-background": "#121c2a",
                    "error": "#ba1a1a",
                    "secondary": "#0051d5",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c5c6d0",
                    "on-tertiary-container": "#82878c",
                    "tertiary-fixed-dim": "#c3c7cd",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-fixed": "#dbe1ff",
                    "secondary-container": "#316bf3",
                    "on-surface": "#121c2a",
                    "on-error": "#ffffff",
                    "surface-variant": "#d9e3f6",
                    "on-primary-fixed-variant": "#304578",
                    "tertiary-fixed": "#dfe3e9",
                    "on-primary-fixed": "#001847",
                    "on-secondary-container": "#fefcff",
                    "inverse-surface": "#27313f",
                    "surface-container": "#e6eeff",
                    "secondary-fixed-dim": "#b4c5ff",
                    "error-container": "#ffdad6",
                    "surface-dim": "#d0dbed",
                    "on-secondary": "#ffffff",
                    "tertiary-container": "#1a1f23",
                    "on-secondary-fixed": "#00174b",
                    "surface-container-high": "#dee9fc",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#b2c5ff",
                    "on-primary-container": "#7185bc",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#d9e3f6"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "8px",
                    "lg": "24px",
                    "xl": "32px",
                    "base": "4px",
                    "gutter": "12px",
                    "xs": "4px",
                    "margin-mobile": "16px",
                    "md": "16px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "label-caps": ["Inter"],
                    "data-mono": ["JetBrains Mono"],
                    "headline-md": ["Hanken Grotesk"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "data-mono": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg": ["30px", {"lineHeight": "38px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased pb-24">
<!-- Top App Bar - Using Shared Component Guidelines (Intent: Linear/Transactional Flow - Hiding global nav elements, focusing on steps) -->
<header class="bg-surface-bright border-b border-outline-variant sticky top-0 z-40">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-3xl mx-auto">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 ease-in-out p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Add Items</h1>
<button class="text-secondary hover:bg-surface-container-low transition-colors duration-200 ease-in-out font-label-caps text-label-caps p-2 rounded">
                SAVE
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-3xl mx-auto px-margin-mobile pt-lg pb-xl">
<!-- Progress Indicator -->
<div class="mb-lg">
<div class="flex justify-between text-label-caps font-label-caps text-on-surface-variant mb-sm">
<span>Step 2 of 3</span>
<span>Line Items</span>
</div>
<div class="w-full bg-surface-container h-2 rounded-full overflow-hidden">
<div class="bg-secondary h-full rounded-full" style="width: 66%;"></div>
</div>
</div>
<!-- Section Header -->
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs">Invoice Items</h2>
<p class="text-on-surface-variant">Add products or services to this invoice.</p>
</div>
<!-- Line Items List -->
<div class="space-y-md mb-lg">
<!-- Item Card 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md shadow-sm relative overflow-hidden group">
<div class="absolute right-0 top-0 bottom-0 w-16 bg-error-container flex items-center justify-center translate-x-full group-[.swiping]:translate-x-0 transition-transform duration-300">
<span class="material-symbols-outlined text-on-error-container">delete</span>
</div>
<div class="flex justify-between items-start mb-sm">
<h3 class="font-data-mono text-data-mono text-primary truncate pr-4">Medivit-C</h3>
<button class="text-on-surface-variant flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
<div class="grid grid-cols-2 gap-sm mb-sm">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block">Packing</span>
<span class="text-on-background">1kg</span>
</div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant block">Unit Rate</span>
<span class="font-data-mono text-data-mono text-on-background">2,250</span>
</div>
</div>
<div class="flex justify-between items-center pt-sm border-t border-surface-variant">
<div class="flex items-center space-x-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">Qty:</span>
<span class="font-data-mono text-data-mono bg-surface-container px-2 py-1 rounded">12kg</span>
</div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant block">Amount</span>
<span class="font-data-mono text-data-mono font-semibold text-primary">27,000</span>
</div>
</div>
</div>
<!-- Item Card 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md shadow-sm relative overflow-hidden group">
<div class="flex justify-between items-start mb-sm">
<h3 class="font-data-mono text-data-mono text-primary truncate pr-4">Livocina</h3>
<button class="text-on-surface-variant flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
<div class="grid grid-cols-2 gap-sm mb-sm">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block">Packing</span>
<span class="text-on-background">5 liter</span>
</div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant block">Unit Rate</span>
<span class="font-data-mono text-data-mono text-on-background">2,250</span>
</div>
</div>
<div class="flex justify-between items-center pt-sm border-t border-surface-variant">
<div class="flex items-center space-x-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">Qty:</span>
<span class="font-data-mono text-data-mono bg-surface-container px-2 py-1 rounded">10 liter</span>
</div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant block">Amount</span>
<span class="font-data-mono text-data-mono font-semibold text-primary">22,500</span>
</div>
</div>
</div>
</div>
<!-- Add Item Action -->
<button class="w-full flex items-center justify-center space-x-2 py-md border-2 border-dashed border-outline-variant rounded-lg text-secondary hover:bg-surface-container-low transition-colors mb-xl">
<span class="material-symbols-outlined">add</span>
<span class="font-label-caps text-label-caps">ADD NEW ITEM</span>
</button>
</main>
<!-- Sticky Bottom Summary & Actions -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant shadow-[0_-4px_12px_rgba(0,0,0,0.05)] pb-safe z-50">
<div class="max-w-3xl mx-auto px-margin-mobile py-md">
<!-- Running Total -->
<div class="flex justify-between items-end mb-md">
<span class="font-headline-md text-headline-md text-on-surface-variant">Total Due</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary-container font-data-mono">
                    Rs. 49,500
                </span>
</div>
<!-- Primary Action -->
<div class="flex space-x-sm">
<button class="flex-1 bg-secondary text-on-secondary font-label-caps text-label-caps py-3 rounded-lg hover:bg-secondary-container hover:text-on-secondary-container transition-colors shadow-md flex justify-center items-center">
                    CONTINUE TO SUMMARY
                    <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
