<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Export Invoice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#f8f9ff",
                    "on-tertiary-fixed": "#171c20",
                    "background": "#f8f9ff",
                    "on-secondary-fixed-variant": "#003ea8",
                    "on-surface-variant": "#44464f",
                    "inverse-primary": "#b2c5ff",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#495d91",
                    "outline": "#757780",
                    "tertiary": "#030609",
                    "on-tertiary-fixed-variant": "#43474c",
                    "surface": "#f8f9ff",
                    "primary-container": "#001b4d",
                    "surface-container-low": "#eff4ff",
                    "primary-fixed": "#dae2ff",
                    "primary": "#000417",
                    "on-background": "#121c2a",
                    "error": "#ba1a1a",
                    "secondary": "#0051d5",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c5c6d0",
                    "on-tertiary-container": "#82878c",
                    "tertiary-fixed-dim": "#c3c7cd",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-fixed": "#dbe1ff",
                    "secondary-container": "#316bf3",
                    "on-surface": "#121c2a",
                    "on-error": "#ffffff",
                    "surface-variant": "#d9e3f6",
                    "on-primary-fixed-variant": "#304578",
                    "tertiary-fixed": "#dfe3e9",
                    "on-primary-fixed": "#001847",
                    "on-secondary-container": "#fefcff",
                    "inverse-surface": "#27313f",
                    "surface-container": "#e6eeff",
                    "secondary-fixed-dim": "#b4c5ff",
                    "error-container": "#ffdad6",
                    "surface-dim": "#d0dbed",
                    "on-secondary": "#ffffff",
                    "tertiary-container": "#1a1f23",
                    "on-secondary-fixed": "#00174b",
                    "surface-container-high": "#dee9fc",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#b2c5ff",
                    "on-primary-container": "#7185bc",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#d9e3f6"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "8px",
                    "lg": "24px",
                    "xl": "32px",
                    "base": "4px",
                    "gutter": "12px",
                    "xs": "4px",
                    "margin-mobile": "16px",
                    "md": "16px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "label-caps": ["Inter"],
                    "data-mono": ["JetBrains Mono"],
                    "headline-md": ["Hanken Grotesk"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "data-mono": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg": ["30px", {"lineHeight": "38px", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Success Animation */
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideUpFade {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .animate-scale-in {
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animate-slide-up-1 { opacity: 0; animation: slideUpFade 0.5s ease-out 0.3s forwards; }
        .animate-slide-up-2 { opacity: 0; animation: slideUpFade 0.5s ease-out 0.4s forwards; }
        .animate-slide-up-3 { opacity: 0; animation: slideUpFade 0.5s ease-out 0.5s forwards; }
        .animate-slide-up-4 { opacity: 0; animation: slideUpFade 0.5s ease-out 0.6s forwards; }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar -->
<header class="bg-surface-bright text-primary font-headline-md text-headline-md docked full-width top-0 border-b border-outline-variant transition-colors duration-200 ease-in-out flex justify-between items-center px-margin-mobile h-16 w-full sticky z-40">
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Invoice Maker</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-mobile max-w-md mx-auto w-full">
<!-- Success Celebration Section -->
<div class="flex flex-col items-center justify-center mb-xl w-full">
<div class="w-24 h-24 bg-secondary-container rounded-full flex items-center justify-center mb-lg animate-scale-in shadow-lg">
<span class="material-symbols-outlined fill-icon text-on-secondary-container text-5xl" data-icon="check_circle">check_circle</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center mb-sm animate-slide-up-1">Invoice Ready!</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-lg animate-slide-up-1">Invoice #468 has been generated successfully.</p>
<!-- Invoice Summary Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md mb-xl animate-slide-up-2 shadow-sm">
<div class="flex justify-between items-center border-b border-surface-variant pb-sm mb-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant">Billed To</span>
<span class="font-body-md text-body-md text-on-background font-semibold">Ijaz Ahmad</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">Total Amount</span>
<span class="font-data-mono text-data-mono text-primary font-bold text-lg">Rs. 151,500</span>
</div>
</div>
</div>
<!-- Export Actions -->
<div class="w-full space-y-md animate-slide-up-3">
<h3 class="font-label-caps text-label-caps text-outline mb-sm px-sm">Export Options</h3>
<!-- Primary Export Buttons -->
<div class="grid grid-cols-2 gap-md">
<button class="bg-secondary text-on-secondary font-label-caps text-label-caps rounded-xl py-lg px-md flex flex-col items-center justify-center gap-sm hover:opacity-90 active:scale-95 transition-all shadow-md">
<span class="material-symbols-outlined text-2xl" data-icon="picture_as_pdf">picture_as_pdf</span>
<span>Save as PDF</span>
</button>
<button class="bg-surface-container-lowest border border-outline-variant text-primary font-label-caps text-label-caps rounded-xl py-lg px-md flex flex-col items-center justify-center gap-sm hover:bg-surface-container-low active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined text-2xl" data-icon="image">image</span>
<span>Save as Image</span>
</button>
</div>
</div>
<!-- Sharing Actions -->
<div class="w-full mt-xl space-y-md animate-slide-up-4">
<h3 class="font-label-caps text-label-caps text-outline mb-sm px-sm">Quick Share</h3>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-background font-body-md text-body-md rounded-lg py-md px-md flex items-center gap-md hover:bg-surface-container-low active:scale-95 transition-all shadow-sm">
<div class="w-10 h-10 rounded-full bg-[#25D366]/10 flex items-center justify-center text-[#25D366]">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
</div>
<div class="flex-1 text-left">
<span class="block font-semibold">Share via WhatsApp</span>
<span class="block text-xs text-on-surface-variant">Send directly to client's phone</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-background font-body-md text-body-md rounded-lg py-md px-md flex items-center gap-md hover:bg-surface-container-low active:scale-95 transition-all shadow-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<div class="flex-1 text-left">
<span class="block font-semibold">Email to Client</span>
<span class="block text-xs text-on-surface-variant">Attach as PDF</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Create New Action -->
<button class="mt-xl font-label-caps text-label-caps text-secondary hover:underline py-sm px-md animate-slide-up-4">
            Create Another Invoice
        </button>
</main>
</body></html>
