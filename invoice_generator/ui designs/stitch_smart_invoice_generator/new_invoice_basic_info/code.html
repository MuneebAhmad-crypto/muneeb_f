<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Invoice - Step 1</title>

        tailwind.config = {

                      "error": "#ba1a1a",

                      "on-tertiary": "#ffffff",

                      "on-tertiary-container": "#82878c",
                      "tertiary-fixed-dim": "#c3c7cd",
                      "inverse-on-surface": "#eaf1ff",
                      "secondary-fixed": "#dbe1ff",
                      "secondary-container": "#316bf3",
                      "on-surface": "#121c2a",
                      "on-error": "#ffffff",
                      "surface-variant": "#d9e3f6",
                      "on-primary-fixed-variant": "#304578",
                      "tertiary-fixed": "#dfe3e9",
                      "on-primary-fixed": "#001847",
                      "on-secondary-container": "#fefcff",
                      "inverse-surface": "#27313f",
                      "surface-container": "#e6eeff",
                      "secondary-fixed-dim": "#b4c5ff",
                      "error-container": "#ffdad6",
                      "surface-dim": "#d0dbed",
                      "on-secondary": "#ffffff",
                      "tertiary-container": "#1a1f23",
                      "on-secondary-fixed": "#00174b",
                      "surface-container-high": "#dee9fc",
                      "on-primary": "#ffffff",
                      "primary-fixed-dim": "#b2c5ff",
                      "on-primary-container": "#7185bc",
                      "on-error-container": "#93000a",
                      "surface-container-highest": "#d9e3f6"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "sm": "8px",
                      "lg": "24px",
                      "xl": "32px",
                      "base": "4px",
                      "gutter": "12px",
                      "xs": "4px",
                      "margin-mobile": "16px",
                      "md": "16px"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"
                      ],
                      "label-caps": [
                              "Inter"
                      ],
                      "data-mono": [

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-surface-bright text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="bg-surface-bright border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 w-full docked full-width top-0 z-10 transition-colors duration-200 ease-in-out">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">New Invoice</h1>
</div>
<div class="flex items-center">
<button class="text-secondary font-label-caps text-label-caps uppercase tracking-wider hover:bg-surface-container-low px-4 py-2 rounded-lg transition-colors">
                Save Draft
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col p-margin-mobile gap-lg pb-32">
<!-- Progress Indicator -->
<div class="flex flex-col gap-xs mb-md">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-primary uppercase">Step 1 of 3</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Header &amp; Client Info</span>
</div>
<div class="h-2 bg-surface-container rounded-full overflow-hidden w-full">
<div class="h-full bg-secondary rounded-full" style="width: 33.33%;"></div>
</div>
</div>
<!-- Invoice Details Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm">
<h2 class="font-headline-md text-headline-md text-primary mb-md border-b border-outline-variant pb-xs">Invoice Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Invoice Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="invoice_no">Invoice #</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="tag">tag</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-[#F9FAFB] border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all font-data-mono text-data-mono text-on-surface" id="invoice_no" placeholder="e.g. INV-001" type="text"/>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="invoice_date">Date</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="calendar_today">calendar_today</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-[#F9FAFB] border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all font-body-md text-body-md text-on-surface" id="invoice_date" type="date"/>
</div>
</div>
<!-- Order Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="order_no">Order # (Optional)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="receipt_long">receipt_long</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-[#F9FAFB] border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all font-data-mono text-data-mono text-on-surface" id="order_no" placeholder="e.g. PO-551" type="text"/>
</div>
</div>
</div>
</section>
<!-- Client Information Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm">
<h2 class="font-headline-md text-headline-md text-primary mb-md border-b border-outline-variant pb-xs">Client Information</h2>
<div class="grid grid-cols-1 gap-md">
<!-- Delivered To (Client Name) -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="client_name">Delivered To (Client Name)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-[#F9FAFB] border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all font-body-md text-body-md text-on-surface font-semibold" id="client_name" placeholder="Enter client name" type="text"/>
</div>
</div>
<!-- Client Address -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="client_address">Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 pt-3 text-on-surface-variant items-start h-full">
<span class="material-symbols-outlined text-[20px]" data-icon="location_on">location_on</span>
</span>
<textarea class="w-full pl-10 pr-4 py-3 bg-[#F9FAFB] border border-outline-variant rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all font-body-md text-body-md text-on-surface resize-none" id="client_address" placeholder="Enter client address" rows="3"></textarea>
</div>
</div>
<!-- Invoiced To (Checkbox) -->
<div class="flex items-center gap-sm mt-xs">
<input checked="" class="w-5 h-5 text-secondary border-outline-variant rounded focus:ring-secondary focus:ring-2 bg-[#F9FAFB]" id="invoiced_to_same" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface" for="invoiced_to_same">Invoiced to same address</label>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 w-full bg-surface-bright border-t border-outline-variant p-margin-mobile flex justify-end items-center z-20 pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<button class="bg-secondary text-white font-label-caps text-label-caps uppercase tracking-wider py-3 px-8 rounded-full shadow-md hover:bg-secondary/90 transition-colors flex items-center gap-xs">
            Next Step
            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Navigation Shell (Suppressed due to transactional flow constraint) -->
<!-- Navigation intentionally omitted for 'Create' linear flow -->
</body></html>
